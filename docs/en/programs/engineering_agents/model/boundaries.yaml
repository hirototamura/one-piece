program: engineering_agents
boundaries:
  - id: B-cli-scenario
    from: cli
    to: scenario
  - id: B-scenario-agents
    from: scenario
    to: agents
  - id: B-scenario-env
    from: scenario
    to: environment
  - id: B-scenario-core
    from: scenario
    to: core
  - id: B-env-backend
    from: environment
    to: external_sim_backend

allocate:
  - { element: B-cli-scenario, requirement: EA-SW-SUB-CLI-010 }
  - { element: B-scenario-agents, requirement: EA-SW-SUB-AGT-010 }
  - { element: B-scenario-env, requirement: EA-SW-SUB-SCN-010 }
  - { element: B-scenario-core, requirement: EA-SW-SUB-CORE-010 }
  - { element: B-env-backend, requirement: EA-SW-SUB-ENV-010 }
