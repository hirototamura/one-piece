program: engineering_agents
parameters:
  - { id: P-N, text: "Iteration count N" }
  - { id: P-agents_mode, text: "Agent mode" }
  - { id: P-run_id, text: "Run id (evidence key)" }
  - { id: P-proposals_path, text: "Path to proposals to apply (empty = none)" }
  - { id: P-proposals_count, text: "Number of emitted proposals" }
constraints:
  - { id: C-N-ge-1, text: "P-N >= 1", constrains: P-N }
  - { id: C-proposals_emitted, text: "P-proposals_count >= 1 after Cycle 1", constrains: P-proposals_count }
  - { id: C-result_delta, text: "Cycle 2 results differ from Cycle 1", constrains: P-proposals_path }
  - { id: C-truth-gate, text: "Pass materials are sim results, constraints, and evidence only", constrains: P-agents_mode }
  - { id: C-pytest_green, text: "Regression suite succeeds" }
