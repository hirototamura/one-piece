[project]
name = "one-piece-connectors"
version = "0.1.0"
description = "Reverse-ingestion connectors for one-piece"
readme = "README.md"
requires-python = ">=3.11"
dependencies = []

[project.scripts]
one-piece-ingest = "one_piece_connectors.cli:main"

[build-system]
requires = ["hatchling>=1.18.0"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["one_piece_connectors"]

[tool.ruff]
line-length = 100
