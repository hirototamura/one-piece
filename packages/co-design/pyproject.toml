[project]
name = "one-piece-co-design"
version = "0.1.0"
description = "Autonomous co-design loop orchestrator for one-piece"
readme = "README.md"
requires-python = ">=3.11"
dependencies = []

[project.scripts]
one-piece-codesign = "one_piece_codesign.cli:main"

[build-system]
requires = ["hatchling>=1.18.0"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["one_piece_codesign"]

[tool.ruff]
line-length = 100
